apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: s12kunballi
  labels:
    app: worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: voting-app
      containers:
      - image: dockersamples/examplevotingapp_worker
        name: worker
        envFrom:
        - configMapRef:
            name: voting-app-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voting-app-db-secret
              key: POSTGRES_PASSWORD
