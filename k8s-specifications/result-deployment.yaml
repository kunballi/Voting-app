apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: s12kunballi
  labels:
    app: result
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      serviceAccountName: voting-app
      containers:
      - image: dockersamples/examplevotingapp_result
        name: result
        envFrom:
        - configMapRef:
            name: voting-app-config
        ports:
        - containerPort: 80
          name: result
