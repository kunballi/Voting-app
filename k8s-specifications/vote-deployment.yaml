apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: s12kunballi
  labels:
    app: vote
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      serviceAccountName: voting-app
      containers:
      - image: dockersamples/examplevotingapp_vote
        name: vote
        envFrom:
        - configMapRef:
            name: voting-app-config
        ports:
        - containerPort: 80
          name: vote
